name: Docs Auto Deploy

on:
  push:
    branches:
      - development
    paths:
      - 'docs/client/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-auto-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # RED-85: pineadas por SHA. El job tiene `contents: write` y publica en la rama
      # `gh-pages`, que es un sitio público: un tag comprometido acá publica lo que
      # quiera a nombre del proyecto.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # RED-85: `mkdocs-material` se instalaba sin versión. Este job tiene
      # `contents: write` y publica el sitio público: lo que construye el artefacto se
      # pinea igual que las actions.
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Build docs (strict)
        run: python -m mkdocs build --strict

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: python -m mkdocs gh-deploy --force
