name: Docs Auto Deploy

on:
  push:
    branches:
      - development
    paths:
      - 'docs/client/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-auto-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # RED-85: pineadas por SHA. El job tiene `contents: write` y publica en la rama
      # `gh-pages`, que es un sitio público: un tag comprometido acá publica lo que
      # quiera a nombre del proyecto.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build docs (strict)
        run: python -m mkdocs build --strict

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: python -m mkdocs gh-deploy --force
