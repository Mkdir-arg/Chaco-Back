name: Code Quality

# Sin `paths:` en el trigger, a propósito (RED-20): un workflow filtrado por rutas no
# corre cuando el PR no las toca, su check nunca reporta y un check que nunca reporta no
# puede ser obligatorio —el PR queda esperando para siempre—. El filtro vive adentro de
# cada job: el job termina igual, en `success`, cuando no hay nada que revisar.
#
# Los filtros están repetidos en los tres jobs porque GitHub Actions no soporta anclas
# YAML (`&`/`*`): el parser las rechaza.
on:
  pull_request:
    branches:
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  # RED-63: la familia `F` de Ruff no es estilo —nombre indefinido, import roto, variable
  # fantasma— y hasta hoy salía en amarillo junto con el resto. Este job bloquea.
  ruff-errores:
    name: Ruff errores
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: steps.filtro.outputs.python == 'true'
        run: pip install ruff

      - name: Run Ruff error checks
        if: steps.filtro.outputs.python == 'true'
        run: ruff check . --select F --output-format=github

  # El estilo sigue sin bloquear hasta limpiar la deuda (hoy hay archivos ajenos sin
  # formatear). Cuando llegue a 0 se le saca el `continue-on-error` y se suma al ruleset.
  ruff-estilo:
    name: Ruff estilo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: steps.filtro.outputs.python == 'true'
        run: pip install ruff

      - name: Run Ruff style checks
        if: steps.filtro.outputs.python == 'true'
        run: ruff check . --select E,W,I --output-format=github

      - name: Check formatting
        if: steps.filtro.outputs.python == 'true'
        run: ruff format --check . --diff

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      # Versión fija (RED-85): un release de Bandit no puede volver rojo un PR que no
      # cambió nada. Se sube a mano, en su propio PR.
      - name: Install Bandit
        if: steps.filtro.outputs.python == 'true'
        run: pip install "bandit[toml]==1.9.4"

      - name: Run Bandit
        if: steps.filtro.outputs.python == 'true'
        run: bandit -r . -c pyproject.toml
