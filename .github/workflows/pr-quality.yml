name: Code Quality

# Sin `paths:` en el trigger, a propósito (RED-20): un workflow filtrado por rutas no
# corre cuando el PR no las toca, su check nunca reporta y un check que nunca reporta no
# puede ser obligatorio —el PR queda esperando para siempre—. El filtro vive adentro de
# cada job: el job termina igual, en `success`, cuando no hay nada que revisar.
#
# Los filtros están repetidos en los tres jobs porque GitHub Actions no soporta anclas
# YAML (`&`/`*`): el parser las rechaza.
on:
  pull_request:
    branches:
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  # RED-63: la familia `F` de Ruff no es estilo —nombre indefinido, import roto, variable
  # fantasma— y hasta hoy salía en amarillo junto con el resto. Este job bloquea.
  ruff-errores:
    name: Ruff errores
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              # RED-85: subir el pin de una herramienta tiene que correr su propio job.
              - 'requirements-ci.txt'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      # RED-85: la version sale de `requirements-ci.txt`, no de lo ultimo publicado.
      - name: Install Ruff
        if: steps.filtro.outputs.python == 'true'
        run: pip install -r requirements-ci.txt

      - name: Run Ruff error checks
        if: steps.filtro.outputs.python == 'true'
        run: ruff check . --select F --output-format=github

  # El estilo sigue sin bloquear, como pide RED-63. Hoy da 0 y desde el Cambio 196 la
  # versión de Ruff está fija en `requirements-ci.txt` (RED-85), que era la condición que
  # faltaba: un release con una regla E/W nueva ya no puede volver rojo un PR que no
  # cambió nada. Encenderlo —sacarle el `continue-on-error` y sumarlo al ruleset— es una
  # decisión del PM, no un cambio técnico, y no se toma acá.
  ruff-estilo:
    name: Ruff estilo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              # RED-85: subir el pin de una herramienta tiene que correr su propio job.
              - 'requirements-ci.txt'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      # RED-85: la version sale de `requirements-ci.txt`, no de lo ultimo publicado.
      - name: Install Ruff
        if: steps.filtro.outputs.python == 'true'
        run: pip install -r requirements-ci.txt

      # `--ignore E501` va explícito: un `--select` por línea de comandos pisa también el
      # `ignore` de `pyproject.toml`, así que sin esto el job reportaría las 43 líneas
      # largas que el repo ignora a propósito (`line-length = 120` con `E501` apagado).
      - name: Run Ruff style checks
        if: steps.filtro.outputs.python == 'true'
        run: ruff check . --select E,W,I --ignore E501 --output-format=github

      - name: Check formatting
        if: steps.filtro.outputs.python == 'true'
        run: ruff format --check . --diff

  # RED-24: las tres condiciones de cierre que `CLAUDE.md` exige al tocar UI
  # (`compile_templates`, `design_audit`, `check_design_agent`) y la cuarta que exige al
  # terminar un requerimiento (`requerimientos.py --check`) corrían **solo** en la máquina
  # de quien desarrolla, y las dos de diseño además como hook de Claude Code: un cambio
  # hecho desde un IDE o desde la web de GitHub no pasaba por ninguna. `collectstatic`
  # nunca corrió en el CI, y es el que produce el 500 más caro del sistema.
  #
  # Sin filtro por rutas, a propósito: casi cualquier archivo mueve alguna de las cuatro
  # (un `.py` mueve `collectstatic`, un `.md` de `docs/internal` mueve `--check`), y el
  # job es obligatorio en el ruleset, así que tiene que terminar siempre.
  contratos-repo:
    name: Contratos del repo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Caza tags rotos que `manage.py check` no ve: un `{% endfor %}` de más vive en el
      # repo hasta que alguien entra a esa pantalla. `--bloques` suma FE-05: un
      # `{% block %}` que ningún ancestro declara compila igual y Django lo descarta en
      # silencio, así que su JS no llega nunca al navegador.
      - name: Sintaxis de todos los templates
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
        run: python scripts/compile_templates.py --bloques

      - name: Coherencia del archivo de requerimientos
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/requerimientos.py --check

      # `ENVIRONMENT=prd` no es decorativo: es lo que enciende
      # `CompressedManifestStaticFilesStorage`. Con el storage de dev, `collectstatic`
      # copia y no resuelve nada, así que un `{% static 'custom/js/nuevo.js' %}` sin el
      # archivo commiteado pasa igual —y en PRD es «Missing staticfiles manifest entry»
      # en el primer render—. No se conecta a la base ni a Redis: solo lee y escribe.
      - name: Estáticos con manifest
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          DJANGO_DEBUG: "False"
          ENVIRONMENT: prd
          DJANGO_ALLOWED_HOSTS: localhost
          SIIS_API_URL: https://siis.invalido.local
        run: |
          python manage.py collectstatic --noinput
          if [ ! -f staticfiles/staticfiles.json ]; then
            echo "::error::collectstatic no dejó el manifest staticfiles/staticfiles.json"
            exit 1
          fi

      # Ratchet, no umbral cero: el repo arrastra errores heredados y arreglarlos es la
      # Ola 6. El techo vive en `.design-audit-ratchet` (hoy 15, medido el 07-oct-2026;
      # el 42 de antes quedó viejo: las olas 5 y 6 bajaron 27 sin bajar el techo).
      # Lo que este paso impide es que **suban**. El `|| true` es necesario: el
      # script sale con 1 cuando hay errores y el paso corre con `-e -o pipefail`, así que
      # sin él aborta antes de comparar y el gate queda rojo siempre, o sea mudo.
      # Cuando la Ola 6 entregue `design_audit.py --ratchet`, este paso lo reemplaza.
      - name: Adherencia al sistema de diseño (ratchet)
        shell: bash
        run: |
          techo=$(tr -d '[:space:]' < .design-audit-ratchet)
          actual=$( { python scripts/design_audit.py || true; } | sed -nE 's/.*: ([0-9]+) error.*/\1/p')
          if [ -z "$actual" ]; then
            echo "::error::no se pudo leer el total de design_audit.py (¿cambió la línea de resumen?)"
            exit 1
          fi
          echo "design_audit: $actual error(es) · techo $techo"
          if [ "$actual" -gt "$techo" ]; then
            echo "::error::los errores del sistema de diseño subieron de $techo a $actual"
            exit 1
          fi
          if [ "$actual" -lt "$techo" ]; then
            echo "::notice::bajaron a $actual: bajá el techo de .design-audit-ratchet en este mismo PR"
          fi

      # No bloquea: es un recordatorio de la regla de oro de `CLAUDE.md` (el requerimiento
      # se registra al terminarlo), no una condición de cierre automatizable.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        if: github.event_name == 'pull_request'
        id: filtro
        with:
          filters: |
            requerimientos:
              - 'docs/internal/requerimientos.md'

      - name: Recordar el registro del requerimiento
        if: github.event_name == 'pull_request' && steps.filtro.outputs.requerimientos != 'true'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          case "$TITULO" in
            feat*|fix*) echo "::warning::«$TITULO» no toca docs/internal/requerimientos.md (CLAUDE.md, regla de oro)" ;;
          esac

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              # RED-85: subir el pin de una herramienta tiene que correr su propio job.
              - 'requirements-ci.txt'
              - '.github/workflows/pr-quality.yml'

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.python == 'true'
        with:
          python-version: "3.12"

      # Versión fija (RED-85): un release de Bandit no puede volver rojo un PR que no
      # cambió nada. El pin estaba acá en el YAML desde el Cambio 121 y se mudó a
      # `requirements-ci.txt` con el resto de las herramientas; lo sube dependabot.
      - name: Install Bandit
        if: steps.filtro.outputs.python == 'true'
        run: pip install -r requirements-ci.txt

      - name: Run Bandit
        if: steps.filtro.outputs.python == 'true'
        run: bandit -r . -c pyproject.toml
