name: Performance Guard

# También en `push` (RED-20, punto 4): mismo motivo que en `pr-backend.yml`. Mientras no
# estén aplicados los rulesets, es el único rastro visible de un push directo.
on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development

# `pull-requests: read` lo necesita `dorny/paths-filter` del job `Migrate ida y vuelta`:
# en `pull_request` pide los archivos del PR por la API. Con el repo público el token lee
# igual, pero cuando D-RED-01 lo pase a privado el filtro dejaría de resolver y el job
# terminaría en verde sin aplicar una sola migración (mismo bloque que `pr-quality.yml`).
permissions:
  contents: read
  pull-requests: read

jobs:
  performance-budgets:
    name: Query Budgets & Smoke Time
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # `fetch-depth: 0` lo pide el paso de RED-62: compara `perf_budgets.json` contra el
      # árbol **base** del PR, y con el checkout de profundidad 1 ese commit no está.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # RED-62: los presupuestos eran autodeclarados. Un N+1 deja el paso de abajo en
      # rojo («16 → 61») y subir el techo en el mismo PR lo devolvía a verde. Va **antes**
      # de medir: es barato, no necesita la base de datos y el mensaje es más claro que
      # el del presupuesto excedido.
      - name: Un presupuesto que sube viene justificado
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD^)"
          python scripts/check_perf_budgets.py --base "$base"

      - name: Run performance query budgets
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
          DJANGO_DEBUG: "False"
          # La guarda determinista mide el costo del código de negocio. La
          # instrumentación queda apagada acá para que su propio overhead no
          # entre en la comparación contra reference_total_ms, que se midió sin
          # ella. El contrato efímero MySQL+Redis la habilita explícitamente.
          PERFORMANCE_QUERY_MONITORING_ENABLED: "False"
          PERF_TIMING_OUTPUT: ${{ runner.temp }}/perf-timing.json
        run: python manage.py test --tag performance --verbosity=2

      - name: Compare smoke duration
        env:
          PERF_TIMING_OUTPUT: ${{ runner.temp }}/perf-timing.json
        run: python scripts/check_perf_timing.py --result "$PERF_TIMING_OUTPUT"

      - name: Upload deterministic performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-sqlite-report
          path: ${{ runner.temp }}/perf-timing.json
          if-no-files-found: warn

  ephemeral-stack-contract:
    name: Ephemeral MySQL Redis Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chaco_perf_ci
          MYSQL_USER: chaco_perf_ci
          MYSQL_PASSWORD: chaco_perf_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uchaco_perf_ci -pchaco_perf_ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      ENVIRONMENT: ci
      PERFORMANCE_CI: "1"
      PERFORMANCE_QUERY_MONITORING_ENABLED: "True"
      PERFORMANCE_METRICS_WINDOW_SECONDS: "300"
      PERFORMANCE_METRICS_RETENTION_SECONDS: "900"
      PERFORMANCE_METRICS_NAMESPACE: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_NAME: chaco_perf_ci
      DATABASE_USER: chaco_perf_ci
      DATABASE_PASSWORD: chaco_perf_ci
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Migrate and seed isolated data
        run: |
          python manage.py migrate --noinput
          python manage.py seed_perf --scale 200

      - name: Measure from worker one
        run: python manage.py perf_ci_probe --worker worker-1 --output "$RUNNER_TEMP/performance-worker-1.json"

      - name: Measure from worker two
        run: python manage.py perf_ci_probe --worker worker-2 --output "$RUNNER_TEMP/performance-worker-2.json"

      - name: Verify shared aggregation and redacted contract
        run: python manage.py perf_ci_probe --verify --workers 2 --output "$RUNNER_TEMP/performance-ci-report.json"

      - name: Upload ephemeral performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-ephemeral-stack-report
          path: ${{ runner.temp }}/performance-*.json
          if-no-files-found: warn

  # TST-01 (PR R-11): la suite corre sobre SQLite y hay una familia de bugs que ahí da
  # verde y en producción rompe —el UUID con guiones de MariaDB 10.7+, `CONVERT_TZ` sin
  # tablas de zona horaria, `JSON_EXTRACT` con clave numérica, los `select_for_update`
  # que en SQLite son un no-op—. Este job corre los tests marcados `@tag("mysql")`
  # contra los motores de verdad. Vive acá, junto al otro `migrate` real del repo, como
  # pide la ficha; el job `migration-roundtrip` de RED-17 (PR R-13) comparte estos
  # servicios.
  #
  # El runner **no** exporta `PYTEST_RUNNING`: la base es el servicio, y las migraciones
  # se aplican de verdad (sin `DJANGO_SYNCDB_PROJECT_APPS`), que es la otra mitad de lo
  # que TST-01 pedía. `DJANGO_TEST_MOTOR` declara qué motor tiene que haber del otro
  # lado y `MotorDeclaradoTests` lo enfrenta contra el servidor que contestó: un
  # servicio que no levantó la imagen pedida deja el paso en rojo en vez de medir otra
  # cosa en silencio.
  #
  # Todavía **no** es un check obligatorio del ruleset: entra cuando tenga corridas
  # suficientes para saber que es estable (y entonces se suma a
  # `docs/internal/rulesets/ruleset-development.json` y a `CHECKS_OBLIGATORIOS` de
  # `core/tests/test_gates_ci.py`, en el mismo PR).
  motor-real:
    name: Motor real (${{ matrix.motor }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          # 10.11 hasta que H-01 confirme la versión de ECOM; 11 para ver lo que viene.
          - motor: "mariadb:10.11"
            salud: "healthcheck.sh --connect --innodb_initialized"
          - motor: "mariadb:11"
            salud: "healthcheck.sh --connect --innodb_initialized"
          # `mysqladmin` ya no existe en las imágenes de MariaDB 11 y `healthcheck.sh` no
          # existe en las de MySQL: la sonda va por motor, no compartida.
          - motor: "mysql:8.0"
            salud: "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"

    services:
      db:
        image: ${{ matrix.motor }}
        env:
          # Las dos familias de variables con el mismo valor: cada imagen lee las suyas.
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: datanach_motor
          MYSQL_DATABASE: datanach_motor
          # Medido en este PR: la imagen oficial de MariaDB **carga** las tablas de zona
          # horaria al inicializarse, y con ellas `CONVERT_TZ` anda y los bugs que este
          # job busca no se manifiestan. La base de ECOM no las tiene (`CLAUDE.md`
          # §Gotchas): sin esta variable la pata de MariaDB daría un verde vacío. La de
          # MySQL sí las trae, igual que icore, y ahí la ignora.
          MARIADB_INITDB_SKIP_TZINFO: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.salud }}"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_TEST_MOTOR: ${{ matrix.motor }}
      DATABASE_NAME: datanach_motor
      # root: el runner de tests crea y borra `test_datanach_motor`, y el usuario de la
      # imagen solo tiene privilegios sobre la base que ya existe. Es un contenedor
      # efímero que vive lo que dura el job.
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Correr los tests marcados contra el motor real
        run: python manage.py test --tag mysql --verbosity=2

  # RED-17 / RED-19 (PR R-13): hasta hoy una migración entraba sin que nada la ejecutara
  # —el CI arma el esquema desde los modelos— y el camino de **vuelta** no lo probaba
  # nadie. Este job corre la secuencia entera contra el motor de producción y sobre datos
  # sembrados: ida hasta la base del PR con el código de la base, `seed_perf`, ida del PR
  # sobre esas filas, vuelta hasta la base y de nuevo hacia adelante.
  #
  # Dos cosas que el gate estático `scripts/check_migraciones.py` (R-12) no puede ver,
  # porque son de ejecución y no de lectura del archivo, las tapa este job:
  #   (a) una columna que pasa a NOT NULL por `AlterField` (o que pierde su DEFAULT):
  #       `verificar_columnas_obligatorias` compara el esquema real antes y después;
  #   (b) **editar** una migración ya aplicada: `check_sqlmigrate.py` compara el SQL de
  #       ida de cada migración que el PR toca contra el árbol de la base.
  #
  # Las ocho barreras de reversa (runbook D.4) abortan **a propósito**: el script las
  # registra como esperadas y sigue. Eso no es un rojo.
  #
  # Sin `continue-on-error`, al revés de lo que proponía el Anexo B: las dos razones por
  # las que lo pedía —RED-18, la reversa UUID que truncaba, y las barreras de RED-15/57
  # sin declarar— las cerró el Cambio 135. Y **todavía no es obligatorio en el ruleset**,
  # por el mismo motivo que `Motor real`: entra cuando acumule corridas (y entonces se
  # suma a `docs/internal/rulesets/ruleset-development.json` y a `CHECKS_OBLIGATORIOS` de
  # `core/tests/test_gates_ci.py`, en el mismo PR).
  migration-roundtrip:
    name: Migrate ida y vuelta (${{ matrix.motor }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          # Los dos motores de producción: MariaDB 10.11 es ECOM (testing y PRD) y
          # MySQL 8 es icore. `mariadb:11` no entra acá —lo cubre `Motor real` hacia
          # adelante— porque este job es el más caro de los dos y nadie corre esa versión.
          - motor: "mariadb:10.11"
            salud: "healthcheck.sh --connect --innodb_initialized"
          - motor: "mysql:8.0"
            salud: "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"

    services:
      db:
        image: ${{ matrix.motor }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
          # El nombre no es decorativo: `seed_perf` se niega a correr fuera de
          # `chaco_perf_ci` con `ENVIRONMENT=ci` y `PERFORMANCE_CI=1`, y esa guarda hay
          # que satisfacerla con el código **de la base del PR**, que es el que siembra.
          MARIADB_DATABASE: chaco_perf_ci
          MYSQL_DATABASE: chaco_perf_ci
          # La base de ECOM no tiene tablas de zona horaria (`CLAUDE.md` §Gotchas) y la
          # imagen oficial de MariaDB sí las carga: sin esta variable, una migración de
          # datos con `CONVERT_TZ` daría verde acá y `NULL` en producción.
          MARIADB_INITDB_SKIP_TZINFO: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.salud }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # `PERFORMANCE_CI=1` manda sesiones y caché a Redis (`config/settings.py`), y lo
      # pide la guarda de `seed_perf`.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      ENVIRONMENT: ci
      PERFORMANCE_CI: "1"
      PERFORMANCE_METRICS_NAMESPACE: roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_NAME: chaco_perf_ci
      # root: el `migrate` crea y borra tablas, y el usuario de la imagen solo tiene
      # privilegios sobre la base que ya existe. Contenedor efímero que dura el job.
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "13"
      # El `read_timeout` de 10 s de producción cortaría un ALTER sobre datos sembrados
      # con el DDL a medias, que es otro hallazgo (OPS-05) y no lo que este job mide.
      # Vive fuera de `config/` para que el árbol de la base —que no tiene el archivo—
      # también lo encuentre.
      DJANGO_SETTINGS_MODULE: settings_roundtrip
      PYTHONPATH: ${{ github.workspace }}/.github/ci

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El filtro va adentro del job y no en el trigger (RED-20): un check filtrado por
      # `paths:` nunca reporta, y uno que nunca reporta no puede volverse obligatorio.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            migraciones:
              - '**/migrations/*.py'
              - 'scripts/roundtrip_migraciones.py'
              - 'scripts/check_sqlmigrate.py'
              - 'core/management/commands/verificar_columnas_obligatorias.py'
              - 'core/management/commands/seed_perf.py'
              - 'config/settings.py'
              - 'requirements.txt'
              - '.github/ci/settings_roundtrip.py'
              - '.github/workflows/pr-performance.yml'

      # Un filtro que no resuelve deja `outputs.migraciones` vacío, todos los pasos de
      # abajo se saltean y el job termina en verde sin haber aplicado una sola migración.
      # Acá falla en vez de mentir. Sin condición de evento: en los dos —`pull_request` y
      # `push`— la salida es lo único que decide si el job hace algo.
      - name: El filtro por rutas resolvió
        shell: bash
        env:
          MIGRACIONES: ${{ steps.filtro.outputs.migraciones }}
        run: |
          case "$MIGRACIONES" in
            true|false) echo "filtro por rutas: migraciones=$MIGRACIONES" ;;
            *) echo "::error::el filtro por rutas no resolvió (migraciones='$MIGRACIONES'): el job no puede decidir si hay migraciones que probar"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.migraciones == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        if: steps.filtro.outputs.migraciones == 'true'
        run: sudo apt-get install -y default-libmysqlclient-dev

      # El árbol de la base del PR es «la release anterior» de verdad para este PR, y no
      # hace falta esperar al tag de RED-16: es la misma referencia que usa el gate
      # estático de R-12, así que los dos miden exactamente el mismo conjunto de cambios.
      #
      # Va **antes** de instalar: las dependencias que hacen falta son las de los dos
      # árboles, y para leer las de la base hay que tenerla.
      - name: Árbol de la base del PR
        if: steps.filtro.outputs.migraciones == 'true'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD^)"
          echo "BASE=$base" >> "$GITHUB_ENV"
          git worktree add ../base "$base"
          echo "base: $base"

      # Este job corre `manage.py` en **dos** árboles. Si el PR retira una dependencia
      # —el Cambio 153 retiró `django-health-check`—, el árbol de la base la sigue
      # nombrando en `INSTALLED_APPS` y su `migrate` muere con `ModuleNotFoundError`
      # antes de tocar la base: el job se pondría rojo por el motivo equivocado, y el
      # único arreglo aparente sería no retirar nunca una dependencia.
      #
      # Se instalan las dos listas, la de la **base primero** para que los pines del PR
      # ganen en todo lo compartido: lo que se mide es el código del PR.
      - name: Install Python dependencies
        if: steps.filtro.outputs.migraciones == 'true'
        run: |
          pip install -r ../base/requirements.txt
          pip install -r requirements.txt

      - name: Migraciones ida y vuelta, sobre datos
        if: steps.filtro.outputs.migraciones == 'true'
        run: python scripts/roundtrip_migraciones.py --base "$BASE" --arbol-base ../base

      - name: El SQL de ida de una migración aplicada no cambió
        if: steps.filtro.outputs.migraciones == 'true'
        run: python scripts/check_sqlmigrate.py --base "$BASE" --arbol-base ../base
