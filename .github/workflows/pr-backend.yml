name: Backend CI

# También en `push` (RED-20, punto 4): hasta que estén aplicados los rulesets de
# `docs/internal/rulesets/`, un `git push origin development` directo entra sin disparar
# ningún workflow de verificación —todos son `on: pull_request`— pero sí dispara
# `publish-main.yml`, que regenera `main` y es lo que se espeja a ECOM. Con esto un push
# directo deja al menos un check rojo visible antes del espejo.
on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

# `pull-requests: read` lo necesita `dorny/paths-filter` del job `Contratos de API`: en
# `pull_request` pide los archivos del PR por la API. Hoy el repo es público y el token
# lee igual, pero en cuanto D-RED-01 lo pase a privado el filtro dejaría de resolver y un
# check **obligatorio** terminaría en verde sin correr nada (mismo bloque que
# `pr-quality.yml` y `design-agent-contract.yml`).
permissions:
  contents: read
  pull-requests: read

jobs:
  django-check:
    name: Django System Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
          # RED-61: SIIS_API_URL ya no tiene default, y el check de entorno la
          # exige con DEBUG=False. Host ficticio: acá no se habla con SIIS.
          SIIS_API_URL: https://siis.invalido.local
        run: python manage.py check --deploy

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `fetch-depth: 0` lo necesita `check_migraciones.py`: compara contra la base del PR
      # para revisar solo las migraciones **nuevas**.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "False"
        run: python manage.py makemigrations --check --dry-run

      # RED-14, RED-19 y RED-57. Va acá, adentro del job que ya es obligatorio en el
      # ruleset, y no como check nuevo: es el mismo tema (que las migraciones del PR estén
      # bien), tarda menos de un segundo, no necesita base ni dependencias, y un `context`
      # nuevo hay que agregarlo a mano al ruleset del repo —que todavía no está aplicado—.
      # Revisa solo los archivos **agregados** respecto de la base: las migraciones ya
      # aplicadas en producción no se reescriben.
      - name: Contrato de las migraciones nuevas
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          # En un push de rama nueva `before` es todo ceros; ahí la referencia es la rama.
          case "$base" in "" | 0000000000000000000000000000000000000000) base="origin/development" ;; esac
          python scripts/check_migraciones.py --base "$base"

  tests-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: coverage run manage.py test --verbosity=2

      - name: Coverage report
        run: coverage report

  # RED-43: el CI no tenía **ningún** gate de contrato de API. El esquema se podía
  # romper, una clave que el front lee a mano podía desaparecer y una capacidad mal
  # tipeada podía apagar una pantalla, y nada de eso salía rojo hasta que alguien
  # entrara a la pantalla. Este job agrupa todo lo que congela un contrato: el esquema
  # OpenAPI, la app de campo, los endpoints JSON del backoffice, los servicios externos,
  # la forma de los JSON guardados y el catálogo de capacidades.
  #
  # No necesita base (SQLite en memoria), no toca la red y tarda ~9 s de tests: lo caro
  # es instalar las dependencias. Mide ~2-3 min con la caché de pip caliente.
  #
  # El filtro va **adentro** del job (RED-20): con `paths:` en el trigger el check no
  # reporta cuando el PR no toca esas rutas, y un check que no reporta no puede ser
  # obligatorio.
  contratos-api:
    name: Contratos de API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            contrato:
              - '**/*.py'
              - '**/*.html'
              - 'static/**'
              - 'programas/fixtures/contratos/**'
              - 'requirements.txt'
              - '.github/workflows/pr-backend.yml'

      # Un filtro que no resuelve deja `outputs.contrato` vacío, **todos** los pasos de
      # abajo se saltean y el check obligatorio termina en verde sin haber corrido nada:
      # el peor modo de falla de un gate. Acá el job falla en vez de mentir. Solo en
      # `pull_request`, que es donde la salida decide algo: en `push` los pasos corren
      # igual.
      - name: El filtro por rutas resolvió
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CONTRATO: ${{ steps.filtro.outputs.contrato }}
        run: |
          case "$CONTRATO" in
            true|false) echo "filtro por rutas: contrato=$CONTRATO" ;;
            *) echo "::error::el filtro por rutas no resolvió (contrato='$CONTRATO'): el job no puede decidir si hay contratos que verificar"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        run: pip install -r requirements.txt

      # **Sin `--fail-on-warn`** todavía: hoy el esquema deja 15 warnings únicos y el
      # gate nacería rojo. Se enciende cuando la allowlist de RED-37 quede vacía (Ola 7).
      # El conteo con ratchet lo mide `core.tests.test_api_schema_contrato`, que corre
      # en el paso siguiente; acá lo que se valida es el documento OpenAPI en sí.
      - name: Esquema OpenAPI válido
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: python manage.py spectacular --validate --file /dev/null

      # Un solo proceso: los módulos comparten la base de test y la caché, igual que en
      # la suite completa. `programas.tests.test_definicion_contrato` y el paso de `node`
      # con `scripts/check_condiciones_js.mjs` los agrega el PR R-17 (RED-12, RED-38):
      # hoy no existen y nombrarlos dejaría el job rojo desde el primer día.
      - name: Tests de contrato
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: >
          python manage.py test
          core.tests.test_api_schema_contrato
          core.tests.test_contrato_errores_ajax
          core.tests.test_urls_del_front
          dashboard.tests.test_api_contrato
          programas.tests.test_becas_api_contrato
          programas.tests.test_contratos_externos
          programas.tests.test_json_compatibilidad
          users.tests.test_rbac_contrato
