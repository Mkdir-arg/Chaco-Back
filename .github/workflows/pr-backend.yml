name: Backend CI

# También en `push` (RED-20, punto 4): hasta que estén aplicados los rulesets de
# `docs/internal/rulesets/`, un `git push origin development` directo entra sin disparar
# ningún workflow de verificación —todos son `on: pull_request`— pero sí dispara
# `publish-main.yml`, que regenera `main` y es lo que se espeja a ECOM. Con esto un push
# directo deja al menos un check rojo visible antes del espejo.
on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

# `pull-requests: read` lo necesita `dorny/paths-filter` del job `Contratos de API`: en
# `pull_request` pide los archivos del PR por la API. Hoy el repo es público y el token
# lee igual, pero en cuanto D-RED-01 lo pase a privado el filtro dejaría de resolver y un
# check **obligatorio** terminaría en verde sin correr nada (mismo bloque que
# `pr-quality.yml` y `design-agent-contract.yml`).
permissions:
  contents: read
  pull-requests: read

jobs:
  django-check:
    name: Django System Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
          # RED-61: SIIS_API_URL ya no tiene default, y el check de entorno la
          # exige con DEBUG=False. Host ficticio: acá no se habla con SIIS.
          SIIS_API_URL: https://siis.invalido.local
        run: python manage.py check --deploy

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `fetch-depth: 0` lo necesita `check_migraciones.py`: compara contra la base del PR
      # para revisar solo las migraciones **nuevas**.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "False"
        run: python manage.py makemigrations --check --dry-run

      # RED-14, RED-19 y RED-57. Va acá, adentro del job que ya es obligatorio en el
      # ruleset, y no como check nuevo: es el mismo tema (que las migraciones del PR estén
      # bien), tarda menos de un segundo, no necesita base ni dependencias, y un `context`
      # nuevo hay que agregarlo a mano al ruleset del repo —que todavía no está aplicado—.
      # Revisa solo los archivos **agregados** respecto de la base: las migraciones ya
      # aplicadas en producción no se reescriben.
      - name: Contrato de las migraciones nuevas
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          # En un push de rama nueva `before` es todo ceros; ahí la referencia es la rama.
          case "$base" in "" | 0000000000000000000000000000000000000000) base="origin/development" ;; esac
          python scripts/check_migraciones.py --base "$base"

  tests-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    # RED-86: 25, como pide la ficha. El 15 original ya había subido a 20 por el
    # `branch = true` de TST-03 (~50 % más de tiempo, medido: de 480 s a 744 s). Lo que
    # no se arreglaba subiendo el techo es que **un timeout se ve como «failure»
    # genérico**: la reacción es «re-run» y nadie ve el número crecer. Por eso, además
    # del techo, el paso `Duración de la suite` escribe los minutos en el resumen del job
    # y emite `::warning::` a partir de 12, que es el aviso de la ficha.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      # RED-85: `coverage` se instalaba sin versión, así que un release suyo podía mover
      # el número que compara `fail_under` en un PR que no tocó código. Sale de
      # `requirements-ci.txt`, igual que ruff, pip-audit y bandit.
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      # RED-86: la suite corre en **cuatro procesos** (`--parallel 4`, el ancho del
      # runner estándar de GitHub). Lo bloqueaba RED-88 —`--parallel` moría con
      # `cannot pickle 'traceback' object` sin decir qué test falló—, cerrada en el PR
      # R-20. La cobertura se sigue midiendo igual: `concurrency = ["multiprocessing"]`
      # y `parallel = true` en `pyproject.toml` hacen que cada worker escriba su propio
      # `.coverage.*`, y el paso siguiente los junta. El `fail_under` no se mueve.
      #
      # `date +%s` antes de arrancar: si la suite falla, el paso muere y no escribe nada
      # más, así que el inicio se publica **antes** y la duración se calcula en un paso
      # con `if: always()`.
      - name: Run tests with coverage
        id: suite
        shell: bash
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: |
          echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"
          coverage run manage.py test --parallel 4 --verbosity=2

      # La alarma de crecimiento de la ficha. Corre aunque la suite falle: justamente el
      # caso que importa es el timeout, donde no hay resultado pero sí hay número.
      - name: Duración de la suite
        if: always() && steps.suite.outputs.inicio != ''
        shell: bash
        env:
          INICIO: ${{ steps.suite.outputs.inicio }}
          AVISO_SEGUNDOS: "720"
          TECHO_MINUTOS: "25"
        run: |
          duracion=$(( $(date +%s) - INICIO ))
          minutos=$(( duracion / 60 ))
          echo "Suite (\`--parallel 4\`, con cobertura de ramas): **${duracion} s** (~${minutos} min) · techo del job ${TECHO_MINUTOS} min" >> "$GITHUB_STEP_SUMMARY"
          if [ "$duracion" -gt "$AVISO_SEGUNDOS" ]; then
            echo "::warning::la suite tardó ${minutos} min; el aviso está en $(( AVISO_SEGUNDOS / 60 )) min y el job muere a los ${TECHO_MINUTOS}"
          fi

      # Cada worker de `--parallel` deja su propio archivo de datos (`parallel = true`).
      # Sin esto, `coverage report` no encuentra nada que reportar.
      - name: Combinar la cobertura de los workers
        run: coverage combine

      # Mide el repo entero con el `omit` de `pyproject.toml` (TST-03): fuera
      # `core/performance/*` (muerto), `scripts/*`, `awslabs-mcp/*` y `docker/*`, que
      # no son producto ni viajan en la imagen. Con `branch = true` y
      # `fail_under = 79`, dos puntos abajo de lo medido (81 %).
      - name: Coverage report
        run: coverage report

      # TST-03, segunda mitad: el número global promedia 23.315 sentencias, así que
      # una caída fuerte en un módulo caliente se diluye y no lo mueve. Estos nueve
      # son los flujos por donde pasan el alta en SIIS, el cupo, el padrón y el link
      # público, y están todos entre 92 % y 98 % con ramas (TOTAL 94 %, medido el
      # 07-10-2026). El piso va en 90: es un ratchet, se sube cuando la medición suba.
      #
      # Va como paso del job que ya es obligatorio y no como check nuevo: es el mismo
      # tema (la cobertura de este PR), reusa la medición que ya se hizo y no hay que
      # tocar el ruleset del repo, que todavía no está aplicado.
      - name: Coverage por módulo crítico
        run: >
          coverage report --fail-under=90
          --include=programas/services/siis_envio.py,programas/services/proceso_masivo.py,programas/services/cupo.py,programas/services/inscripcion_publica.py,programas/services/padron.py,programas/services/respuestas.py,programas/api/views.py,portal/views/inscripcion.py,core/rbac.py

  # TST-02: la suite tiene que pasar **en cualquier orden**.
  #
  # Cinco módulos de `programas/tests/` solo pasaban si otro había corrido antes: el
  # Programa Becas quedaba en una caché de proceso que sobrevive al rollback de la base.
  # Se arregló en el PR R-20; esto es lo que avisa si vuelve.
  #
  # **No bloqueante a propósito**: `--shuffle` toma una semilla al azar en cada corrida,
  # así que como gate obligatorio un PR podría quedar rojo por una dependencia de orden
  # que introdujo otro PR, y re-correr lo pondría verde. Un check que no es reproducible
  # no puede bloquear. Lo que sí hace es dejar la evidencia en el log, con la semilla
  # para reproducir.
  #
  # El segundo paso que vivía acá —`core users portal --parallel 2`, el canario que pedía
  # RED-88 «hasta que RED-86 pase la suite entera a paralelo»— se retiró en el PR 5 de la
  # Ola 7, que es el que hizo exactamente eso: `Tests & Coverage` corre ahora la suite
  # completa con `--parallel 4` y **bloquea**, o sea que cubre a esas tres apps con más
  # workers y como gate obligatorio, no como aviso.
  #
  # El job duplica la suite (~8,5 min), por eso va aparte y no adentro de
  # `Tests & Coverage`.
  #
  # El `continue-on-error` va **en el paso que mide**, no en el job: a nivel job, GitHub
  # reporta el check como *success* incluso cuando falla y la evidencia queda solo adentro
  # del log. En el paso, queda marcado en rojo y con su anotación en la pestaña del PR
  # —que es lo que hace falta para que alguien lo mire— mientras el job termina en verde y
  # no bloquea nada.
  orden-y-paralelo:
    name: Orden y paralelo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # La semilla queda impresa en el log: `manage.py test --shuffle <semilla>`
      # reproduce exactamente este orden.
      - name: Suite en orden aleatorio
        continue-on-error: true
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: python manage.py test --shuffle

  # RED-43: el CI no tenía **ningún** gate de contrato de API. El esquema se podía
  # romper, una clave que el front lee a mano podía desaparecer y una capacidad mal
  # tipeada podía apagar una pantalla, y nada de eso salía rojo hasta que alguien
  # entrara a la pantalla. Este job agrupa todo lo que congela un contrato: el esquema
  # OpenAPI, la app de campo, los endpoints JSON del backoffice, los servicios externos,
  # la forma de los JSON guardados y el catálogo de capacidades.
  #
  # No necesita base (SQLite en memoria), no toca la red y tarda ~9 s de tests: lo caro
  # es instalar las dependencias. Mide ~2-3 min con la caché de pip caliente.
  #
  # El filtro va **adentro** del job (RED-20): con `paths:` en el trigger el check no
  # reporta cuando el PR no toca esas rutas, y un check que no reporta no puede ser
  # obligatorio.
  contratos-api:
    name: Contratos de API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            contrato:
              - '**/*.py'
              - '**/*.html'
              - 'static/**'
              - 'programas/fixtures/contratos/**'
              - 'requirements.txt'
              - '.github/workflows/pr-backend.yml'

      # Un filtro que no resuelve deja `outputs.contrato` vacío, **todos** los pasos de
      # abajo se saltean y el check obligatorio termina en verde sin haber corrido nada:
      # el peor modo de falla de un gate. Acá el job falla en vez de mentir. Solo en
      # `pull_request`, que es donde la salida decide algo: en `push` los pasos corren
      # igual.
      - name: El filtro por rutas resolvió
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CONTRATO: ${{ steps.filtro.outputs.contrato }}
        run: |
          case "$CONTRATO" in
            true|false) echo "filtro por rutas: contrato=$CONTRATO" ;;
            *) echo "::error::el filtro por rutas no resolvió (contrato='$CONTRATO'): el job no puede decidir si hay contratos que verificar"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        run: sudo apt-get install -y default-libmysqlclient-dev

      - name: Install Python dependencies
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        run: pip install -r requirements.txt

      # **Sin `--fail-on-warn`** todavía: hoy el esquema deja 15 warnings únicos y el
      # gate nacería rojo. Se enciende cuando la allowlist de RED-37 quede vacía (Ola 7).
      # El conteo con ratchet lo mide `core.tests.test_api_schema_contrato`, que corre
      # en el paso siguiente; acá lo que se valida es el documento OpenAPI en sí.
      - name: Esquema OpenAPI válido
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: python manage.py spectacular --validate --file /dev/null

      # Un solo proceso: los módulos comparten la base de test y la caché, igual que en
      # la suite completa. `programas.tests.test_definicion_contrato` y el paso de `node`
      # con `scripts/check_condiciones_js.mjs` los agrega el PR R-17 (RED-12, RED-38):
      # hoy no existen y nombrarlos dejaría el job rojo desde el primer día.
      - name: Tests de contrato
        if: steps.filtro.outputs.contrato == 'true' || github.event_name == 'push'
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-a-real-secret
          PYTEST_RUNNING: "1"
          DJANGO_SYNCDB_PROJECT_APPS: "True"
        run: >
          python manage.py test
          core.tests.test_api_schema_contrato
          core.tests.test_contrato_errores_ajax
          core.tests.test_urls_del_front
          dashboard.tests.test_api_contrato
          programas.tests.test_becas_api_contrato
          programas.tests.test_contratos_externos
          programas.tests.test_json_compatibilidad
          users.tests.test_rbac_contrato
