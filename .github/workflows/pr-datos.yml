name: Datos

# También en `push`, no solo en el PR: hasta que RED-20 cree los rulesets de rama,
# un `git push origin development` directo entra sin disparar ningún workflow de
# verificación, y el `--arbol` de `publish-main` mira el árbol **después** del
# `export-ignore`. Sin este disparador, un `scripts/*.sql` forzado al índice se
# quedaría en el repositorio sin que ningún check lo marque.
on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  sin-datos-personales:
    name: Sin datos personales
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ningún archivo nuevo grande ni con volcados de personas
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_datos_personales.py --diff "${{ github.event.pull_request.base.sha }}"

      - name: Ningún volcado entre los archivos versionados
        run: python3 scripts/check_datos_personales.py --versionados

      # El alcance estricto de RED-64 —lo que MkDocs publica— bloquea desde
      # `docs-auto-deploy.yml` y desde la suite. Este es el otro alcance: el
      # repositorio es **público**, así que un dato de una persona en
      # `docs/internal/` se lee igual que uno en `docs/client/`. Va informando y no
      # bloqueando porque sobre esa superficie quedan 37 hallazgos deliberados —DNI
      # de ejemplo en colecciones de Postman, un `head -c 2000000` al lado de la
      # palabra «DNI», direcciones de fixtures de parseo— y sacarlos sería aflojar la
      # regla o inventar una lista de archivos perdonados. Las anotaciones aparecen
      # igual sobre el diff del PR, que es para lo que sirve.
      - name: Barrido de datos personales en docs/ (informativo)
        continue-on-error: true
        run: python3 scripts/check_docs_client.py --todo-docs
