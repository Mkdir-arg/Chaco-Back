name: Design Agent Contract

# Sin `paths:` en el trigger (RED-20): el check tiene que reportar en todo PR a
# `development` para poder ser obligatorio. El filtro está adentro del job y, cuando el
# PR no toca nada de UI ni del contrato, el job termina en `success` sin hacer nada.
on:
  pull_request:
    branches:
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  contract:
    name: Validate inventory and authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filtro
        with:
          filters: |
            diseno:
              - '.claude/agents/**'
              - '.claude/design/**'
              - '.claude/settings.json'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'docs/design-kb/**'
              - 'scripts/check_design_agent.py'
              - 'scripts/test_check_design_agent.py'
              - 'scripts/design_audit.py'
              - 'scripts/design_audit_hooks.txt'
              - 'scripts/test_design_audit.py'
              - '.github/workflows/design-agent-contract.yml'
              - '**/templates/**/*.html'
              - 'static/custom/css/**/*.css'
              - 'static/custom/js/**/*.js'
              - 'tailwind.config.js'
              - 'package.json'
              - 'package-lock.json'

      - uses: actions/setup-python@v6
        if: steps.filtro.outputs.diseno == 'true'
        with:
          python-version: "3.12"

      # `--limites` exige lo que el paso 4 de la Ola 6 dejó cierto: núcleo
      # ≤ 30.000 bytes, celdas del inventario ≤ 450 caracteres y cero historia
      # (la historia vive en docs/internal/requerimientos.md). Sin la bandera el
      # núcleo vuelve a crecer como changelog sin que falle nada.
      - name: Validate design-agent contract
        if: steps.filtro.outputs.diseno == 'true'
        run: python scripts/check_design_agent.py --limites --base "${{ github.event.pull_request.base.sha }}"

      - name: Test design-agent checker
        if: steps.filtro.outputs.diseno == 'true'
        run: python scripts/test_check_design_agent.py

      - name: Test design audit
        if: steps.filtro.outputs.diseno == 'true'
        run: python scripts/test_design_audit.py

      # Ratchet: la deuda de diseño preexistente no bloquea, pero el PR no puede
      # sumar ni un hallazgo nuevo de las 8 reglas P1. Compara cada archivo de UI
      # tocado contra su versión en la base del PR.
      - name: Design audit ratchet
        if: steps.filtro.outputs.diseno == 'true'
        run: python scripts/design_audit.py --ratchet --base "${{ github.event.pull_request.base.sha }}"

      # Las goldens (la pantalla que se clona por arquetipo) tienen que estar en 0:
      # 0 hallazgos P1 y los marcadores de su arquetipo completos. El paso 3 de la
      # Ola 6 las saneó y acá se saca el `continue-on-error` con el que nacieron.
      # La lista sale de la tabla `## Arquetipos` del núcleo (paso 4): si el núcleo
      # deja de declararla, o declara menos goldens que `design_audit.GOLDENS`, el
      # step falla en vez de salir verde sin verificar nada.
      - name: Design audit goldens
        if: steps.filtro.outputs.diseno == 'true'
        run: python scripts/design_audit.py --goldens

      # Gate de build (V5A-NEW-01): `static/custom/css/tailwind.css` está
      # committeado y ningún workflow lo regeneraba, así que una utilidad nueva
      # entraba al markup sin existir en el CSS y la pantalla se veía mal sin que
      # fallara nada. Es lo único que distingue «utilidad válida sin build» de
      # «utilidad inválida»: CLASSDEF no puede.
      - uses: actions/setup-node@v4
        if: steps.filtro.outputs.diseno == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Tailwind build is committed
        if: steps.filtro.outputs.diseno == 'true'
        run: |
          npm ci
          npm run build:tailwind
          if ! git diff --exit-code -- static/custom/css/tailwind.css; then
            echo "::error file=static/custom/css/tailwind.css::El CSS de Tailwind quedó desactualizado: correr 'npm run build:tailwind' y commitear static/custom/css/tailwind.css"
            exit 1
          fi
