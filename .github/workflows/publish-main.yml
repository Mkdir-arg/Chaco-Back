name: Publish main

on:
  push:
    branches:
      - development
  # La publicación a mano saltea el gate de CI verde (RED-21): dispararla exige permiso
  # de escritura sobre el repo, o sea una persona decidiendo. Lo que no puede es pasar
  # sin dejar por qué, así que el motivo es obligatorio y queda en el log de la corrida.
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por qué se publica a mano, sin exigir el CI verde del PR"
        required: true
        type: string

permissions:
  contents: write
  # RED-21: para buscar el PR del commit publicado y leer los checks de su head.
  pull-requests: read
  checks: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # El `push` ya viene filtrado a `development`, pero `workflow_dispatch` se puede
    # disparar sobre **cualquier** rama, y el job publica `main` con el árbol de la rama
    # que haya checkouteado: una rama de trabajo cualquiera, saltéandose el gate de CI
    # verde, llegaría a ECOM y a la imagen de PRD. El release solo sale de `development`.
    if: github.ref == 'refs/heads/development'

    steps:
      # RED-85: pineada por SHA. Un tag es mutable, y este workflow tiene
      # `contents: write` sobre `main`, que es de donde sale el espejo a ECOM y la
      # imagen de PRD: un tag comprometido acá es un camino directo a producción.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # RED-21: `main` es lo que se espeja a ECOM y lo que se hornea en la imagen de PRD.
      # Hasta hoy se publicaba sin mirar si el commit había pasado por algún PR ni si ese
      # PR estaba en verde: 23 commits de código entraron a `development` en 90 días sin
      # PR (RED-20) y todos generaron release. Con los rulesets aplicados esto es defensa
      # en profundidad; sin ellos es lo único que frena un release ciego.
      #
      # El merge commit **no tiene check-runs** —los PRs los corren sobre su head—, así
      # que consultarlos sobre `github.sha` devolvería una lista vacía y el paso pasaría
      # siempre. Hay que buscar el PR del commit y mirar los checks de su head.
      - name: Exigir que el commit venga de un PR con CI verde
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                 --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          if [ -z "$head" ]; then
            echo "::error::$SHA no viene de un PR mergeado: no se publica release"
            exit 1
          fi
          gh api "repos/$REPO/commits/$head/check-runs?per_page=100" \
             --jq '.check_runs[] | [.name, (.conclusion // "sin terminar")] | @tsv' > "$RUNNER_TEMP/checks.tsv"

          # **Cero check-runs no es verde.** Mirar solo los que fallaron deja el agujero
          # más grande del gate: un PR en el que los workflows nunca arrancaron —porque
          # alguien los borró, los deshabilitó, o el push del head no los disparó— no
          # tiene ni un check malo, así que pasaría igual y el release saldría ciego.
          if [ ! -s "$RUNNER_TEMP/checks.tsv" ]; then
            echo "::error::el PR ($head) no tiene ni un check-run: no se publica release"
            exit 1
          fi

          # `null` (todavía corriendo) también cuenta como no exitoso: no se publica un
          # release mientras el CI del PR sigue en vuelo.
          fail=0
          while IFS=$'\t' read -r nombre conclusion; do
            case "$conclusion" in
              success|neutral|skipped) ;;
              *) echo "::error::check no exitoso en el PR ($head): $nombre ($conclusion)"; fail=1 ;;
            esac
          done < "$RUNNER_TEMP/checks.tsv"

          # Y que estén **todos** los que el ruleset declara obligatorios: así un check
          # que no corrió se distingue de uno que no existe. La lista sale del JSON
          # versionado, que es la misma fuente que aplica el dueño del repo (RED-20), y
          # `core/tests/test_gates_ci.py` la enfrenta contra una lista literal.
          #
          # **Del head del PR, no del árbol de acá.** Leerlo del árbol actual le exige a
          # un PR checks que no existían cuando corrió el suyo: el día que este mismo
          # cambio entre, cualquier PR abierto de antes —que corrió 9 checks porque
          # «Contratos del repo» todavía no existía— dejaría de publicar aunque esté
          # entero en verde, y `main` se quedaría quieta sin que nadie se entere. El
          # contrato de un PR es el que estaba vigente en su head.
          if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            # Con merge commit el head es el segundo padre y ya está; un squash merge no
            # lo deja en la historia, así que se lo pide al remoto.
            git fetch --no-tags --depth=1 origin "$head" 2>/dev/null || true
          fi
          if git show "$head:docs/internal/rulesets/ruleset-development.json" > "$RUNNER_TEMP/ruleset.json" 2>/dev/null; then
            jq -r '.rules[] | select(.type == "required_status_checks")
                   | .parameters.required_status_checks[].context' \
               "$RUNNER_TEMP/ruleset.json" > "$RUNNER_TEMP/obligatorios.txt"
            # Una lista vacía no puede pasar muda: significaría que el `jq` dejó de
            # encontrar la ruta —el formato del ruleset cambió— y que esta comprobación
            # se apagó sola, sin exigir un solo check.
            if [ ! -s "$RUNNER_TEMP/obligatorios.txt" ]; then
              echo "::error::el ruleset de $head no declara ningún check obligatorio: ¿cambió su formato?"
              exit 1
            fi
            while IFS= read -r contexto; do
              [ -n "$contexto" ] || continue
              if ! cut -f1 "$RUNNER_TEMP/checks.tsv" | grep -Fxq "$contexto"; then
                echo "::error::el PR ($head) no corrió el check obligatorio «$contexto»"
                fail=1
              fi
            done < "$RUNNER_TEMP/obligatorios.txt"
          else
            # Un head anterior al Cambio 121 no tiene el archivo. Ahí no hay lista de
            # obligatorios que exigir y queda lo de arriba: al menos un check y ninguno
            # en rojo. Borrar el ruleset para caer acá no sirve de atajo: hacerlo pone en
            # rojo `Tests & Coverage`, que es uno de los checks que sí se miran.
            echo "::warning::el head del PR ($head) no tiene ruleset versionado: solo se exige que no haya checks rojos"
          fi

          [ "$fail" = "0" ] || exit 1
          echo "PR verde en $head ($(wc -l < "$RUNNER_TEMP/checks.tsv") checks)"

      - name: Publicación a mano
        if: github.event_name == 'workflow_dispatch'
        run: echo "::warning::release publicado a mano, sin el gate de CI verde. Motivo - ${{ github.event.inputs.motivo }}"

      # RED-01, primero el repositorio: `git archive` ya aplicó `export-ignore`, así que
      # un `scripts/*.sql` forzado al índice no aparecería en el árbol del release
      # aunque siga versionado y visible en `development`. Esto mira lo que hay de
      # verdad en el commit que se publica.
      - name: Sin datos personales en el repositorio
        run: python3 scripts/check_datos_personales.py --versionados

      - name: Construir árbol de release
        run: mkdir -p "$RUNNER_TEMP/release" && git archive HEAD | tar -x -C "$RUNNER_TEMP/release"

      # Y después el release: si se cuela igual, en un formato que los ignores no
      # contemplan, no sale. Es la última barrera antes de `main` y del espejo de ECOM.
      - name: Sin datos personales en el release
        run: python3 scripts/check_datos_personales.py --arbol "$RUNNER_TEMP/release"

      # RED-21: lo prohibido ya no se escribe a mano. Había dos listas —esta y la de
      # `export-ignore` en `.gitattributes`— que decían casi lo mismo y nada las
      # sincronizaba: lo que no estaba en ninguna viajaba al release sin que nadie se
      # enterara (`CONTEXT.md`, 17 KB de documentación interna, lo hizo durante meses).
      # Ahora el denylist **es** `.gitattributes`, leído con `git check-attr`, que es
      # exactamente lo que aplica el `git archive` de arriba: si las dos cosas dejan de
      # coincidir, es que algo forzó un archivo al árbol después del `archive`.
      #
      # `RUNTIME` y `DOCS_DE_RUNTIME` quedan en variables, y no inline en el `for`, para
      # que `core/tests/test_publish_guard.py` pueda leerlas sin interpretar shell
      # (RED-65: ese test afirma que cada ruta exigida existe de verdad en el árbol).
      - name: Guard
        shell: bash
        run: |
          RUNTIME="manage.py requirements.txt docker-compose.prod.yml docker/django/Dockerfile scripts/startup.sh scripts/deploy_prod.sh nginx.conf docker-entrypoint.sh Dockerfile .gitlab-ci.yml"
          DOCS_DE_RUNTIME="README.md"
          fail=0

          # Se pregunta por **cada ruta del release**, directorios incluidos, y no por
          # cada archivo versionado. No es un detalle: en `.gitattributes` un patrón de
          # directorio (`/docs`, `/.claude`) marca el directorio, no lo de adentro —
          # `git check-attr export-ignore docs/internal/x.md` contesta «unspecified»
          # aunque `git archive` se saltee el subárbol entero—. Recorriendo el release
          # el directorio aparece como ruta propia y la pregunta da «set».
          #
          # Todas las rutas versionadas son ASCII sin espacios (verificado); si alguna vez
          # dejan de serlo, el `sed` deja de matchear: el efecto sería un falso negativo,
          # no un falso positivo.
          find "$RUNNER_TEMP/release" -mindepth 1 -printf '%P\n' \
            | git check-attr --stdin export-ignore \
            | sed -n 's/: export-ignore: set$//p' > "$RUNNER_TEMP/colados.txt"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "::error::$path está marcado export-ignore y aparece igual en el release"
            fail=1
          done < "$RUNNER_TEMP/colados.txt"

          # Un `.md` nuevo en la raíz no está en ninguna lista y viaja solo. O se marca
          # `export-ignore` en `.gitattributes`, o se declara acá como documentación que
          # el release tiene que llevar. No hay tercera opción silenciosa.
          find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.md' -printf '%P\n' > "$RUNNER_TEMP/md-de-la-raiz.txt"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case " $DOCS_DE_RUNTIME " in *" $path "*) continue;; esac
            echo "::error::$path viaja al release sin estar declarado: marcalo export-ignore o sumalo a DOCS_DE_RUNTIME"
            fail=1
          done < "$RUNNER_TEMP/md-de-la-raiz.txt"

          for path in $RUNTIME; do
            if [ ! -e "$RUNNER_TEMP/release/$path" ]; then
              echo "::error::Falta el archivo de runtime requerido $path en el release"
              fail=1
            fi
          done

          exit "$fail"

      - name: Publicar snapshot en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -B main "$RUNNER_TEMP/mainwt" origin/main
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/release/" "$RUNNER_TEMP/mainwt/"
          cd "$RUNNER_TEMP/mainwt"
          git add -A
          if git diff --cached --quiet; then
            echo "main al día"
            exit 0
          fi
          subj="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s)"
          short="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git commit -m "release: $subj (development@$short)"
          git push origin main

          # RED-16: cada release deja un tag inmutable sobre el commit de `main`.
          # Sin él, «volver a la release anterior» no tiene a qué apuntar: `main` se
          # pisa a sí misma en cada publicación y del lado de ECOM la imagen es siempre
          # `:latest`, así que un rollback significaba revertir en GitLab y esperar otro
          # build de 5 a 7 minutos **con producción caída y la base ya migrada**. Con el
          # tag, el runbook (Anexo D de docs/internal/processes.md) tiene un nombre que
          # escribir: `git switch --force-create rollback/<ts> <tag anterior>` en icore,
          # y el SHA exacto para pedirle a ECOM la imagen anterior.
          #
          # El `$short` es el de `development`, no el de `main`: es el commit que
          # alguien reconoce, el mismo que ya va en el asunto del commit de release.
          # Va además de la fecha porque puede haber más de un release por día.
          tag="release-$(date -u +%Y.%m.%d)-$short"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::warning::el tag $tag ya existe en origin: la release quedó publicada, no se re-etiqueta"
            exit 0
          fi
          git tag -a "$tag" -m "release $(date -u +%F) (development@$short)"
          # Solo este ref: `--tags` empujaría cualquier otro tag que el runner tenga.
          git push origin "refs/tags/$tag"
          echo "release etiquetado: $tag"
