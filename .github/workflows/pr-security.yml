name: Security

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # RED-85: con `pip install pip-audit` cada corrida traía lo último publicado, y
      # este check es **obligatorio** desde el Cambio 121: un release de pip-audit que
      # estreche una regla frena todos los merges abiertos a la vez, incluidos los PRs
      # que no tocaron ninguna dependencia. Con el pin, la novedad llega cuando se sube
      # la versión, en un PR que la mira.
      - name: Install pip-audit
        run: pip install -r requirements-ci.txt

      # RED-63: los ignores salen de `security/excepciones.toml`, no del YAML. Cada
      # entrada declara motivo, ticket y `vence_el`, y este paso pone el job en rojo el
      # día que una excepción vence: renovarla es editar la fecha en un PR, que es
      # exactamente la revisión que antes no existía.
      - name: Excepciones de seguridad vigentes
        run: python3 scripts/check_excepciones_seguridad.py

      # Los tres archivos, no solo el de la imagen: `requirements-dev.txt` se instala en
      # la máquina de quien desarrolla y `requirements-ci.txt` en los runners, que tienen
      # el token del workflow. Una advisory ahí no llega a PRD, pero tampoco se entera
      # nadie si no se audita. Van en invocaciones separadas y no con tres `-r` para que
      # el rojo diga qué archivo es, y `requirements.txt` se audita por su cuenta aunque
      # `requirements-dev.txt` lo arrastre con su `-r`.
      - name: Audit dependencies
        shell: bash
        run: |
          read -r -a ignores <<< "$(python3 scripts/check_excepciones_seguridad.py --ignore-args)"
          fail=0
          for archivo in requirements.txt requirements-dev.txt requirements-ci.txt; do
            echo "::group::pip-audit -r $archivo"
            pip-audit -r "$archivo" "${ignores[@]}" || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
