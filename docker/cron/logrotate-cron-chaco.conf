# Rotación del log de las tareas programadas de DATAÑACH en icore-srv (G3-05).
# ---------------------------------------------------------------------------
# `~/cron-chaco.log` es el único registro de las corridas periódicas y crecía sin
# límite: `generar_alertas` escribe cada hora, y en un servidor que lleva meses
# arriba el archivo es lo bastante grande como para que nadie lo abra, que es la
# peor forma de no tener log.
#
# INSTALACIÓN (una sola vez por servidor, como root):
#   cp docker/cron/logrotate-cron-chaco.conf /etc/logrotate.d/chaco-cron
#   logrotate --debug /etc/logrotate.d/chaco-cron   # ensayo, no rota nada
#
# Ajustar la ruta si el usuario del cron no es `icore`.
#
# `copytruncate` porque el envoltorio abre el archivo en cada corrida con `>>` y no
# hay un proceso de larga vida al que avisarle: copiar y truncar es lo que no pierde
# las líneas de una corrida en curso.
/home/icore/cron-chaco.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
