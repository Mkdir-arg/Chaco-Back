# Fragmento de Deployment: el bootstrap fuera del contenedor que atiende.
#
# El initContainer usa la MISMA imagen con args ["bootstrap"]: el entrypoint corre
# migraciones + estáticos + sembrado y termina. Así el server puede arrancar con el
# comando que la plataforma prefiera sin dejar el esquema atrasado ni roles
# faltantes.
#
# UN SOLO MIGRADOR (RED-19). Django **no** toma ningún candado para `migrate` en
# MySQL/MariaDB. Dos procesos migrando a la vez se pisan y, si se cruzan dentro de una
# migración de varias operaciones, el esquema queda a medias **sin** fila en
# `django_migrations`: medido contra MariaDB 11.8, uno de los dos muere con 1050 desde
# base vacía y con 1060 desde base al día. Por eso:
#
#   - el contenedor `web` lleva `RUN_MIGRATIONS=false` siempre: nunca migra;
#   - un initContainer corre en **cada** pod, así que solo alcanza con `replicas: 1`;
#   - con `replicas > 1` el `migrate` va en `bootstrap-job.yaml`, que corre una sola
#     vez antes del rollout, y acá también se pone `RUN_MIGRATIONS=false`.
#
# Desde OPS-07 el arranque toma además un candado `GET_LOCK('datanach_bootstrap', 900)`
# sobre una conexión dedicada, que envuelve la guarda de esquema, el `migrate` y el
# sembrado (`manage.py bootstrap_lock`). Es una red, no un reemplazo de la regla de
# arriba: serializa a los pods que arrancan a la vez, pero N pods migrando de a uno
# siguen siendo N arranques lentos, y el que no consigue el candado en 900 s **aborta sin
# migrar**. Quien decide quién migra sigue siendo el manifiesto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanach-web
spec:
  template:
    spec:
      initContainers:
        - name: bootstrap
          image: <IMAGEN>
          args: ["bootstrap"]
          envFrom:
            - secretRef:
                name: <SECRET-ENV>
          volumeMounts:
            - name: media
              mountPath: /app/media
            # Compartido con el contenedor web: el collectstatic del bootstrap
            # escribe acá. Sin este volumen, los estáticos quedan en el filesystem
            # efímero del initContainer y el web (con comando propio) arranca sin
            # manifest: toda pantalla con estáticos responde 500.
            - name: staticfiles
              mountPath: /app/staticfiles
      containers:
        - name: web
          image: <IMAGEN>
          # El initContainer de arriba (o el Job, con replicas > 1) es el que garantiza
          # migraciones, sembrado y estáticos. Este contenedor **nunca** migra: con
          # varias réplicas, el `migrate` del entrypoint convierte cada arranque en un
          # migrador más (RED-19).
          envFrom:
            - secretRef:
                name: <SECRET-ENV>
          env:
            - name: RUN_MIGRATIONS
              value: "false"
            # Mismo motivo que `RUN_MIGRATIONS`, un paso más abajo: sin esto, cada pod
            # que arranca corre también `seed_datos_base`, `crear_programas` y
            # `seed_catalogo_siis`. Son idempotentes, pero N réplicas sembrando a la vez
            # se pisan en los `update_or_create` y alargan cada arranque; el initContainer
            # (o el Job) ya los corrió.
            - name: LOCAL_BOOTSTRAP_COMMANDS
              value: "false"
          ports:
            - containerPort: 8000
          # Regla de consistencia de puertos: APP_PORT (env) = containerPort =
          # targetPort del Service = puerto de las tres probes. Si se cambia uno
          # (p. ej. a 8001), se cambian los cuatro.
          #
          # El startupProbe es imprescindible: el primer arranque corre migraciones,
          # estáticos y sembrado y puede tardar minutos. Sin él, el liveness mata el
          # bootstrap a mitad de camino y el pod entra en loop de reinicios
          # (exit code 137, sin ningún error en el log).
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            periodSeconds: 30
          volumeMounts:
            # Persistente: acá viven los adjuntos que cargan los territoriales.
            - name: media
              mountPath: /app/media
            - name: staticfiles
              mountPath: /app/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: datanach-media
        # Efímero a propósito: se regenera en cada arranque con collectstatic.
        - name: staticfiles
          emptyDir: {}
