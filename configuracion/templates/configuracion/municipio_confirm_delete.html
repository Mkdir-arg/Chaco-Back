{% extends "includes/main.html" %}
{% load static %}

{% block title %}Eliminar Municipio{% endblock %}

{% block content %}
<div class="p-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Eliminar Municipio</h1>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <div class="mb-4">
            <p class="text-gray-700">¿Está seguro que desea eliminar el municipio <strong>{{ object.nombre }}</strong>?</p>
            <p class="text-sm text-red-600 mt-2">Esta acción no se puede deshacer.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-3">
                <a href="{% url 'configuracion:municipios' %}" class="btn-nodo btn-tertiary btn-base">Cancelar</a>
                <button type="submit" class="btn-nodo btn-danger btn-base">Eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
