{% comment %}
Medidor de avance de una sección de ficha. No se incluye suelto: lo usa components/_ficha_seccion.html.
Contexto heredado: titulo, avance (0-100), avance_tono (brand | warning).
{% endcomment %}
<span class="inline-flex items-center gap-2 text-xs font-semibold text-body-subtle">
  <span class="inline-block w-20 h-2 rounded-full bg-brand-soft overflow-hidden" role="progressbar" aria-label="Avance de {{ titulo }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ avance }}">
    <span class="nodo-ficha-medidor block h-full {% if avance_tono == 'warning' %}bg-warning{% else %}bg-brand{% endif %}" style="--avance:{{ avance }}%"></span>
  </span>
  {{ avance }} %
</span>
