{% comment %}Google Tag Manager (Cambio 68). Solo se incluye con GTM_CONTAINER_ID
configurado. El dataLayer se inicializa antes del contenedor con la pantalla, el
programa y la convocatoria: nunca con datos de la persona (DNI, contacto, respuestas).{% endcomment %}
<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    "pantalla": "{{ request.resolver_match.url_name|default:''|escapejs }}",
    "programa": "{{ convocatoria.segmento.programa.nombre|default:''|escapejs }}",
    "convocatoria": "{{ convocatoria.nombre|default:''|escapejs }}",
    "convocatoria_id": "{{ convocatoria.pk|default:''|escapejs }}"
  });
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','{{ gtm_container_id }}');</script>
<!-- End Google Tag Manager -->
