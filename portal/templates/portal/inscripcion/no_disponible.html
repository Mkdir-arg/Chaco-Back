{% extends 'portal/base.html' %}

{% block title %}Formulario no disponible - Portal Ciudadano{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center">
    <div class="bg-white p-10 animate-fadeInUp" style="border-radius: var(--radius-2xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border-base);">
        <div class="inline-flex items-center justify-center w-16 h-16 mb-4" style="border-radius: var(--radius-full); background: var(--bg-secondary); color: var(--text-body-subtle);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold" style="color: var(--text-heading);">Formulario no disponible</h1>
        <p class="mt-3 text-sm" style="color: var(--text-body);">Este formulario ya no admite inscripciones.</p>
        <p class="mt-2 text-xs" style="color: var(--text-body-subtle);">Para más información, comunicate con el programa al 0800-222-1133.</p>
    </div>
</div>
{% endblock %}
