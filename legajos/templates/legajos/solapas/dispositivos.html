{% extends "includes/base.html" %}
{% block title %}Dispositivos · {{ ciudadano.nombre_completo }}{% endblock %}
{% block main-content %}
<main class="mx-auto max-w-5xl py-8">
  <a href="{% url 'legajos:ciudadano_detalle' ciudadano.pk %}" class="text-sm text-body-subtle hover:text-fg-brand">← Volver al legajo</a>
  <section class="mt-5 rounded-xl border border-base p-6" style="background:var(--bg-primary)">
    <p class="text-xs font-semibold uppercase tracking-wide text-fg-brand">Legajo ciudadano</p>
    <h1 class="mt-1 text-2xl font-bold text-heading">Dispositivos · {{ ciudadano.nombre_completo }}</h1>
    <p class="mt-5 text-sm text-body-subtle">Todavía no hay estadías registradas para esta persona.</p>
  </section>
</main>
{% endblock %}
