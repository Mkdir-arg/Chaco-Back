[tool.ruff]
line-length = 120
exclude = ["migrations", ".venv", "staticfiles", "docs"]

[tool.ruff.lint]
# DTZ011 (`date.today()`) es de RED-50: los contenedores no definen `TZ`, así que
# corren en UTC y el día del **sistema** es el de mañana entre las 21:00 y las 24:00
# de Chaco. La regla de negocio que eso rompía —RN-22, el corte de los 18 años— vive
# ahora en `core/edad.py` y resuelve «hoy» con `timezone.localdate()`. Donde la fecha
# del proceso sea realmente lo que se quiere (rotación de logs por día de la máquina,
# default de una herramienta de línea de comandos) va un `# noqa: DTZ011` con el motivo.
select = ["E", "F", "W", "I", "DTZ011"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# En un test, fijar la fecha del proceso es justamente el método: la regla mide el
# código que se despliega.
"**/tests/*.py" = ["DTZ011"]
"config/asgi.py" = ["E402"]
"config/settings_production.py" = ["F403", "F405"]
"core/performance/*.py" = ["E722", "W291", "W293", "F841"]
"core/views/performance.py" = ["E402", "E722"]
"legajos/services/ml_predictor.py" = ["E722", "F841"]
"scripts/compile_templates.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["migrations", "tests", ".venv", "docs"]
skips = ["B101", "B104", "B110", "B311", "B404", "B603", "B607"]

# ---------------------------------------------------------------------------
# mypy (RED-76) — adopción gradual, un módulo por PR.
#
# El repo tiene 2,7 % de retornos anotados sobre 2.195 funciones (`programas`: 5 de
# 1.117), así que un checker sobre todo el árbol daría miles de hallazgos y el único
# resultado sería que nadie lo mire. Lo que se adopta acá es el **alcance**, no la
# herramienta: `files` de abajo es la lista de módulos verificados y es lo único que
# crece. Fuera de esa lista mypy no mira nada.
#
# Los dos de arranque son los que pide la ficha, y son los que corresponden: SIIS-11
# (`body.get` sobre una lista) y G1-06 (una fecha cruda al ORM) son errores de tipo que
# un checker habría marcado en el diff. Siguen, un módulo por PR:
# `programas.api.serializers`, `becas`/`diseno` con `TypedDict` para la definición, y
# `siis`/`siis_envio`.
#
# El job (`Tipos (mypy)`, en `pr-quality.yml`) arranca **no bloqueante**; se enciende
# cuando estén los cinco módulos. Correrlo en local:
#
#     & $env:PY_VENV -m mypy
[tool.mypy]
python_version = "3.12"
# El alcance. Una línea nueva por PR, nunca un directorio entero: lo que entra acá
# entra en verde y se queda en verde.
files = [
    "core/edad.py",
    "programas/services/condiciones.py",
    "programas/services/personas.py",
]
# Casi nada del árbol está anotado: sin esto, cada import arrastra los errores del
# módulo importado y el alcance deja de significar algo.
follow_imports = "silent"
ignore_missing_imports = true
exclude = ["(^|/)(migrations|tests)/", "^(\\.venv|\\.venv312|staticfiles|docs|node_modules)/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Un `# type: ignore` sin código de error tapa cualquier cosa y nunca se revisa. Si hace
# falta uno, va con su código (`# type: ignore[arg-type]`) y queda visible.
enable_error_code = ["ignore-without-code"]
pretty = true

[tool.django-stubs]
django_settings_module = "config.settings"

# Lo estricto se aplica **solo** sobre el alcance de `files`: dentro de la lista, una
# función sin anotar o un `Any` que se escapa por un `return` es un error.
[[tool.mypy.overrides]]
module = [
    "core.edad",
    "programas.services.condiciones",
    "programas.services.personas",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.coverage.run]
source = ["."]
# RED-86: la suite del CI corre con `manage.py test --parallel 4`, que reparte los tests
# en procesos hijos con `multiprocessing`. Sin estas dos líneas, coverage mide **solo el
# proceso padre** —que no corre ningún test— y el `fail_under` se desplomaría sin que
# nada hubiera cambiado en el código.
#
# Van en el archivo de configuración y no en la línea de comandos **a propósito**: los
# subprocesos no ven los flags del `coverage run` del padre, solo leen este archivo.
#
# `parallel = true` hace que cada proceso escriba su propio `.coverage.<host>.<pid>.<n>`,
# así que después hay que correr `coverage combine` antes de `coverage report`, también
# en local. `sigterm` cierra el archivo del worker si el job se queda sin tiempo, para
# que el dato parcial no se pierda en silencio.
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
# TST-03: sin esto, un `if` cuyo cuerpo se ejecuta siempre por la misma rama cuenta
# como 100 % cubierto. Medido el 07-10-2026 con la suite completa: 81 % de ramas
# contra 83 % de sentencias, y los nueve módulos críticos 94 % contra 95 %.
branch = true
# TST-03: el 48 % se medía sobre **todo** el repo, incluidas cosas que no son el
# producto (herramientas de desarrollo, módulos muertos, archivos que ni se
# despliegan). Con el alcance acotado a las apps, lo medido es 76 %: un `fail_under`
# de 48 no habría avisado aunque la cobertura real se partiera al medio.
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/settings*",
    ".venv/*",
    "staticfiles/*",
    "docs/*",
    # Módulos de «optimización» muertos: DDL y `SET GLOBAL` que no corre nadie. Se
    # borran en OPS-10 (Ola 7); mientras tanto no son producto y hunden la medición.
    "core/performance/*",
    # Herramientas de desarrollo y de CI, no código desplegado. La imagen de release
    # ni siquiera las lleva (`export-ignore` en `.gitattributes`).
    "scripts/*",
    "awslabs-mcp/*",
    "docker/*",
]

[tool.coverage.report]
# Medido con la suite completa el 07-10-2026 (Python 3.12 + Django 5.2.17, el mismo
# par que el CI) y **con `branch = true`**: 81 % sobre 23.315 sentencias y 6.192
# ramas. El techo queda dos puntos abajo para que un PR no se ponga rojo por
# redondeo. Es un **ratchet**, no un objetivo: cuando la medición suba, sube con ella.
#
# La ficha TST-03 proponía 74 sobre una medición de 76 % del 04-10-2026, sin ramas;
# desde entonces los PRs de las olas R, 1 y 5 agregaron tests y el número real subió.
fail_under = 79
show_missing = true
