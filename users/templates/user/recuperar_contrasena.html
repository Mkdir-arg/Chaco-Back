{% extends "user/base_public_auth.html" %}
{% block title %}Recuperar contraseña — DATAÑACH{% endblock %}
{% block auth_content %}
<h1 class="public-auth__title">Recuperar contraseña</h1>
<p class="public-auth__help">Ingresá el correo asociado a tu usuario.</p>
<form method="post">
  {% csrf_token %}
  <div class="public-auth__field">
    <label for="id_email">Correo electrónico</label>
    <input id="id_email" name="email" type="email" autocomplete="email" required>
    {% for error in form.email.errors %}<p class="public-auth__error">{{ error }}</p>{% endfor %}
  </div>
  <button type="submit" class="public-auth__button">Enviar enlace</button>
</form>
{% endblock %}
